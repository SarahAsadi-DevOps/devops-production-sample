apiVersion: v1
kind: Service
metadata:
  name: "{{ include "fastapi.fullname" . }}"
  labels:
    app: "{{ include "fastapi.name" . }}"
spec:
  type: {{ .Values.service.type }}
  selector:
    app: "{{ include "fastapi.name" . }}"
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
