replicaCount: 3

image:
  repository: sarahasadi/devops-fastapi
  tag: "0.1.2"
  pullPolicy: IfNotPresent

containerPort: 8000

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

config:
  APP_NAME: "fastapi-devops-sample"
  APP_ENV: "development"
  LOG_LEVEL: "info"

ingress:
  enabled: false
  host: ""
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

